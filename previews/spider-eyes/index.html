<!doctype html>
<!-- Development-only fixture: with npm run dev running, copy this file to
     public/__blink-pixel-check.html and open /__blink-pixel-check.html.
     Remove the public copy before building; source imports require the dev server. -->
<html lang="en">
<meta charset="utf-8" />
<title>Blink rendering check</title>
<style>
  body { margin: 24px; font: 15px/1.5 system-ui, sans-serif; color: #e9ecef; background: #141720; }
  h1 { margin-bottom: 4px; font-size: 24px; }
  p { margin-top: 0; }
  canvas { display: block; max-width: 100%; height: auto; border-radius: 8px; }
  .source { position: absolute; width: 596px; height: 401px; visibility: hidden; pointer-events: none; }
  #result { margin-top: 14px; font-weight: 600; }
</style>
<h1>Blink rendering check</h1>
<p>Actual eye artwork at normal and enlarged sizes. The last two columns must contain no eye pixels.</p>
<canvas width="1140" height="640" aria-label="Both blink styles at six stages, on two body colours"></canvas>
<p id="result" role="status">Rendering…</p>
<div class="source" aria-hidden="true"></div>
<script type="module">
  import source from "/src/assets/spider/spider.svg?raw";
  import { config } from "/src/scripts/spider-string/config.ts";
  import { drawEyes, neutralFace } from "/src/scripts/spider-string/face.ts";
  const holder = document.querySelector(".source");
  holder.innerHTML = source;
  const eyes = ["left", "right"].map(side => {
    const group = holder.querySelector(`[data-part="eye"][data-side="${side}"]`);
    const white = group.querySelector('[data-part="eye-white"]');
    const pupil = group.querySelector('[data-part="pupil"]');
    const box = white.getBBox(), p = pupil.getBBox();
    return { side, white: new Path2D(white.getAttribute("d")), pupil: new Path2D(pupil.getAttribute("d")),
      center: [box.x + box.width / 2, box.y + box.height / 2], radius: Math.min(box.width, box.height) / 2,
      extent: [box.width / 2, box.height / 2], pupilCenter: [p.x + p.width / 2, p.y + p.height / 2], look: [0, 0], slosh: [0, 0] };
  });
  const canvas = document.querySelector("canvas"), ctx = canvas.getContext("2d");
  const phases = [0, 0.3, 0.6, 0.85, 0.97, 1];
  const rows = [["lids", "#1b1e29"], ["squash", "#1b1e29"], ["lids", "#2b8666"], ["squash", "#2b8666"]];
  let changed = 0;
  config.eyelids.finish = "none";
  rows.forEach(([style, body], row) => {
    config.blink.style = style;
    phases.forEach((phase, column) => {
      const x = column * 190, y = row * 160;
      ctx.fillStyle = body;
      ctx.fillRect(x, y, 190, 160);
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, 190, 160); ctx.clip();
      ctx.translate(x + 95, y + 85); ctx.scale(0.36, 0.36); ctx.translate(-298, -187);
      drawEyes(ctx, eyes, neutralFace(), phase, { body, eyes: "#fff", pupils: "#1b1e29", mouth: "#fff" });
      ctx.restore();
      ctx.save();
      ctx.translate(x + 95, y + 130); ctx.scale(0.12, 0.12); ctx.translate(-298, -187);
      drawEyes(ctx, eyes, neutralFace(), phase, { body, eyes: "#fff", pupils: "#1b1e29", mouth: "#fff" });
      ctx.restore();
      if (phase >= 0.97) {
        const expected = body.match(/[a-f0-9]{2}/g).map(hex => parseInt(hex, 16));
        const pixels = ctx.getImageData(x, y, 190, 160).data;
        for (let i = 0; i < pixels.length; i += 4) if (pixels[i] !== expected[0] || pixels[i + 1] !== expected[1] || pixels[i + 2] !== expected[2]) changed++;
      }
      ctx.fillStyle = "#fff"; ctx.font = "13px system-ui";
      ctx.fillText(`${style} · ${Math.round(phase * 100)}% shut`, x + 12, y + 22);
    });
  });
  document.querySelector("#result").textContent = changed === 0
    ? "PASS — 0 stray eye pixels in all closed samples (both styles, sizes and colours)."
    : `FAIL — ${changed} stray pixels remain in closed samples.`;
</script>
</html>
